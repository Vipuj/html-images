<!DOCTYPE html>
<html>
<head>
    <title>HTML Images</title>
</head>
<body>

    <!-- src tells the browser where the image is located -->
    <!-- alt provides alternative text if the image cannot be displayed -->
    <img src="image.jpg" alt="Example image">
    <br><br>

    <!-- width and height control the displayed size -->
    <img src="image.jpg" alt="Example image" width="300" height="200">
    <br><br>

    <!-- An image can also be placed inside a link -->
    <a href="https://www.google.com">
        <img src="image.jpg" alt="Clickable image" width="200">
    </a>

</body>
</html>
